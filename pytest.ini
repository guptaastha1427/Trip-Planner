[pytest]
testpaths = tests
pythonpath = .
markers =
    eval_regression: full golden-suite regression vs eval/regression_thresholds.json (slow)
filterwarnings =
    ignore:.*langchain-community.*:DeprecationWarning
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    ignore::DeprecationWarning:langchain_community
